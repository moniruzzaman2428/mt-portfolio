# Optional: auto-deploy to Firebase Hosting on every push to main.
# Setup: run `firebase init hosting:github` once (it creates the secret), or add the
# secret FIREBASE_SERVICE_ACCOUNT_MD_MONIRUZZAMAN_TONOY manually in GitHub → Settings → Secrets.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MD_MONIRUZZAMAN_TONOY }}
          channelId: live
          projectId: md-moniruzzaman-tonoy
